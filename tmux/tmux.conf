set-window-option -g mode-keys vi

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'


# turn mouse on
set -g mouse on
# restore vim sessions
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
# restore panes
set -g @resurrect-capture-pane-contents 'on'
# restore last saved environment (automatically)
set -g @continuum-restore 'on'

# Realod
bind r source-file ~/.tmux.conf\; display "Configuration file reloaded."
# Change the sufix
set -g prefix C-a
# Synchronization on/off
bind e setw synchronize-panes on
bind E setw synchronize-panes off

# The Vim keybinding settings
bind-key -T copy-mode-vi v send-keys -X begin-selection
# use vim bindings for copy mode
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Enable mouse control (clickable windows, panes, resizable panes)
# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# This is for tmux plugins
run '~/.tmux/plugins/tpm/tpm'

# Mirror Latin-key bindings onto the Russian layout; keep this last
run-shell '"#{d:current_file}/russian-layout.sh"'
